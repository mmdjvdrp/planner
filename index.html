<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقویم روزانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --surface3: #2a2a38;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8e8f0;
    --muted: #7070a0;
    --accent: #7c5cfc;
    --accent2: #a78bfa;
    --accent-glow: rgba(124,92,252,0.25);
  }
  body[data-theme="light"] {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface2: #eef1f7;
    --surface3: #e1e6f0;
    --border: rgba(16,24,40,0.08);
    --border2: rgba(16,24,40,0.16);
    --text: #1f2937;
    --muted: #64748b;
    --accent: #2563eb;
    --accent2: #0f766e;
    --accent-glow: rgba(37,99,235,0.18);
  }
  body[data-theme="forest"] {
    --bg: #101612;
    --surface: #18221c;
    --surface2: #203027;
    --surface3: #2a3d32;
    --border: rgba(220,252,231,0.08);
    --border2: rgba(220,252,231,0.16);
    --text: #e7f6ec;
    --muted: #82a891;
    --accent: #22c55e;
    --accent2: #86efac;
    --accent-glow: rgba(34,197,94,0.2);
  }
  body[data-theme="sunset"] {
    --bg: #171114;
    --surface: #24191d;
    --surface2: #302126;
    --surface3: #3d2b31;
    --border: rgba(255,237,213,0.08);
    --border2: rgba(255,237,213,0.16);
    --text: #fff1f2;
    --muted: #bd8f9b;
    --accent: #f43f5e;
    --accent2: #fbbf24;
    --accent-glow: rgba(244,63,94,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(124,92,252,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap { max-width: 960px; margin: 0 auto; position: relative; z-index: 1; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    margin-bottom: 24px;
  }
  .logo {
    font-size: 20px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    display: inline-block;
  }
  .date-nav {
    display: flex; align-items: center; gap: 8px;
  }
  .theme-select {
    width: auto;
    min-width: 96px;
    padding: 6px 10px;
    font-size: 12px;
  }
  .date-nav button {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
  }
  .date-nav button:hover { background: var(--surface3); border-color: var(--accent); }
  #date-label {
    font-size: 14px; font-weight: 500; color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px; padding: 6px 14px;
    min-width: 160px; text-align: center;
  }
  .btn-today {
    font-size: 12px; padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--muted); cursor: pointer;
    font-family: inherit;
    transition: color .15s, border-color .15s;
  }
  .btn-today:hover { color: var(--text); border-color: var(--accent); }

  /* Layout */
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
  @media(max-width:680px){ .grid { grid-template-columns: 1fr; } }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card:last-child { margin-bottom: 0; }
  .card-title {
    font-size: 11px; font-weight: 700;
    color: var(--muted); letter-spacing: .1em;
    text-transform: uppercase; margin-bottom: 16px;
  }

  /* Form */
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block; font-size: 12px;
    color: var(--muted); margin-bottom: 5px;
  }
  input[type=text], select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Vazirmatn', sans-serif;
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none;
  }
  input[type=text]:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  select option {
    background: var(--surface);
    color: var(--text);
  }
  body[data-theme="light"] select option {
    background: #fff;
    color: #1f2937;
  }

  .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .time-field { position: relative; }
  .time-field input {
    font-family: 'Vazirmatn', monospace;
    font-size: 15px; letter-spacing: 1px;
    padding-left: 36px;
    text-align: center;
  }
  .time-field .now-btn {
    position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    background: var(--surface3); border: none;
    color: var(--muted); font-size: 10px;
    padding: 2px 5px; border-radius: 4px;
    cursor: pointer; font-family: inherit;
    transition: color .15s;
  }
  .time-field .now-btn:hover { color: var(--accent2); }

  .cat-row { display: flex; gap: 6px; }
  .cat-row select { flex: 1; }
  .btn-icon {
    width: 36px; height: 36px; flex-shrink: 0;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 8px; color: var(--muted);
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s;
  }
  .btn-icon:hover { color: var(--accent2); border-color: var(--accent); }

  .new-cat-box {
    background: var(--surface2);
    border: 1px dashed var(--border2);
    border-radius: 8px; padding: 10px;
    margin-top: 8px; display: none;
  }
  .new-cat-inner { display: flex; gap: 6px; align-items: center; }
  .new-cat-inner input { flex: 1; }
  input[type=color] {
    width: 34px; height: 34px; flex-shrink: 0;
    border: 1px solid var(--border2);
    border-radius: 6px; cursor: pointer;
    padding: 2px; background: var(--surface3);
  }
  .btn-save-cat {
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border2);
    background: var(--surface3);
    color: var(--text); font-size: 12px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .btn-save-cat:hover { border-color: var(--accent); color: var(--accent2); }

  .cat-manager {
    margin-top: 10px;
    display: grid;
    gap: 6px;
  }
  .cat-item {
    display: grid;
    grid-template-columns: 24px 1fr 34px 34px;
    align-items: center;
    gap: 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
  }
  .cat-swatch {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--cat-color, var(--accent));
    box-shadow: 0 0 10px color-mix(in srgb, var(--cat-color, var(--accent)) 40%, transparent);
    justify-self: center;
  }
  .cat-name {
    font-size: 12px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-color-edit { width: 32px; height: 32px; }
  .cat-delete {
    width: 32px; height: 32px;
    border: 1px solid var(--border2);
    border-radius: 8px;
    background: var(--surface3);
    color: var(--muted);
    cursor: pointer;
  }
  .cat-delete:hover { color: #f87171; border-color: rgba(248,113,113,.5); }
  .cat-empty {
    color: var(--muted);
    font-size: 12px;
    padding: 8px 0 0;
  }

  .btn-primary {
    width: 100%; padding: 10px;
    border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), #5c3fcc);
    color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    margin-top: 6px;
    transition: opacity .15s, transform .1s;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:active { transform: scale(.98); }

  .btn-live {
    width: 100%; padding: 9px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    margin-top: 8px;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn-live:hover { background: var(--surface3); border-color: var(--accent); color: var(--accent2); }
  .btn-live.is-running {
    border-color: rgba(248,113,113,.55);
    color: #fecaca;
    background: rgba(248,113,113,.12);
  }
  .live-status {
    min-height: 18px;
    margin-top: 6px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }

  .err-msg {
    font-size: 11px; color: #f87171;
    margin-top: 4px; display: none;
  }

  /* Timeline */
  .tl-wrap {
    border-right: 2px solid var(--border2);
    padding-right: 18px; margin-right: 6px;
    min-height: 40px;
  }
  .tl-item {
    position: relative; margin-bottom: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-right: 3px solid var(--ic, #7c5cfc);
    border-radius: 10px; padding: 11px 14px;
    display: flex; align-items: center; gap: 10px;
    transition: border-color .15s, background .15s;
  }
  .tl-item:hover { background: var(--surface2); }
  .tl-dot {
    position: absolute; right: -26px; top: 13px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--ic, #7c5cfc);
    border: 2px solid var(--bg);
    box-shadow: 0 0 6px var(--ic, #7c5cfc);
  }
  .tl-info { flex: 1; min-width: 0; }
  .tl-title {
    font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .tl-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tl-badge {
    font-size: 10px; padding: 2px 7px;
    border-radius: 999px; color: #fff; font-weight: 700;
  }
  .tl-time {
    font-family: 'Vazirmatn', monospace; font-size: 12px;
    background: var(--surface3); padding: 2px 7px;
    border-radius: 5px; color: var(--text);
  }
  .tl-dur { font-size: 11px; color: var(--muted); }
  .btn-del {
    width: 28px; height: 28px; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; color: var(--muted);
    font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn-del:hover { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.4); color: #f87171; }

  .empty-msg {
    text-align: center; color: var(--muted);
    font-size: 13px; padding: 32px 0;
  }
  .empty-icon { font-size: 32px; margin-bottom: 8px; opacity: .4; }

  /* Report */
  .report-item { margin-bottom: 10px; }
  .report-header {
    display: flex; justify-content: space-between;
    font-size: 12px; margin-bottom: 5px; color: var(--text);
  }
  .prog-bg {
    background: var(--surface3); height: 7px;
    border-radius: 4px; overflow: hidden;
  }
  .prog-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
  .total-line {
    font-size: 12px; color: var(--muted);
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .total-line span { color: var(--accent2); font-weight: 700; }

  /* Activity Map */
  .map-controls {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  .map-month-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .map-month-nav button {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
  }
  .map-month-nav button:hover { border-color: var(--accent); color: var(--accent2); }
  #map-month-label {
    min-width: 76px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  .activity-map {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 7px;
  }
  .map-weekday {
    color: var(--muted);
    font-size: 10px;
    text-align: center;
  }
  .map-day {
    position: relative;
    aspect-ratio: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 10px;
  }
  .map-day.is-empty {
    opacity: .25;
    background: transparent;
  }
  .map-dot {
    width: var(--dot-size, 6px);
    height: var(--dot-size, 6px);
    border-radius: 50%;
    background: color-mix(in srgb, var(--dot-color, var(--accent)) var(--dot-strength, 22%), var(--surface3));
    box-shadow: 0 0 calc(var(--dot-size, 6px) * .55) color-mix(in srgb, var(--dot-color, var(--accent)) var(--dot-glow, 0%), transparent);
    border: 1px solid color-mix(in srgb, var(--dot-color, var(--accent)) 45%, transparent);
    transition: width .2s, height .2s, background .2s, box-shadow .2s, transform .15s;
  }
  .map-day:hover .map-dot {
    transform: scale(1.08);
  }
  .map-day:hover {
    border-color: var(--dot-color, var(--accent));
    color: var(--text);
  }
  .map-day-num {
    position: absolute;
    top: 4px;
    inset-inline-start: 5px;
    font-size: 9px;
    color: inherit;
  }
  .map-empty {
    color: var(--muted);
    font-size: 12px;
    padding: 12px 0 2px;
    text-align: center;
  }
  .map-summary {
    color: var(--muted);
    font-size: 11px;
    margin-top: 10px;
    text-align: center;
  }
  .map-summary span { color: var(--accent2); font-weight: 700; }
  @media(max-width:680px){
    .map-controls { grid-template-columns: 1fr; }
    .map-month-nav { justify-content: center; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <span class="logo-dot"></span>
      تقویم روزانه
    </div>
    <div class="date-nav">
      <button id="prev-day" title="روز قبل">&#8249;</button>
      <div id="date-label"></div>
      <button id="next-day" title="روز بعد">&#8250;</button>
      <button class="btn-today" id="btn-today">امروز</button>
      <select id="theme-select" class="theme-select" title="تم">
        <option value="dark">دارک</option>
        <option value="light">لایت</option>
        <option value="forest">سبز</option>
        <option value="sunset">غروب</option>
      </select>
    </div>
  </div>

  <div class="grid">
    <!-- Left column -->
    <div>
      <!-- Add Event -->
      <div class="card">
        <div class="card-title">ثبت فعالیت جدید</div>
        <div class="form-group">
          <label>عنوان فعالیت</label>
          <input type="text" id="act-title" placeholder="مثلاً: مطالعه، ورزش، گیم...">
        </div>
        <div class="form-group">
          <label>دسته‌بندی</label>
          <div class="cat-row">
            <select id="cat-select"></select>
            <button class="btn-icon" id="toggle-cat" title="دسته جدید">+</button>
          </div>
          <div class="new-cat-box" id="new-cat-box">
            <div class="new-cat-inner">
              <input type="text" id="new-cat-name" placeholder="نام دسته">
              <input type="color" id="new-cat-color" value="#7c5cfc">
              <button class="btn-save-cat" id="save-cat">ذخیره</button>
            </div>
          </div>
          <div class="cat-manager" id="cat-manager"></div>
        </div>
        <div class="form-group">
          <label>زمان شروع و پایان</label>
          <div class="time-row">
            <div class="time-field">
              <input type="text" id="start-time" placeholder="08:30" maxlength="5" autocomplete="off">
              <button class="now-btn" id="btn-now-s">الان</button>
            </div>
            <div class="time-field">
              <input type="text" id="end-time" placeholder="10:00" maxlength="5" autocomplete="off">
              <button class="now-btn" id="btn-now-e">الان</button>
            </div>
          </div>
          <div class="err-msg" id="time-err">⚠ فرمت صحیح: HH:MM مثلاً ۱۴:۳۰</div>
        </div>
        <button class="btn-primary" id="add-btn">+ افزودن به تایم‌لاین</button>
        <button class="btn-live" id="live-btn">شروع / پایان با ساعت سیستم</button>
        <div class="live-status" id="live-status"></div>
      </div>

      <!-- Report -->
      <div class="card">
        <div class="card-title">گزارش ۷ روز گذشته</div>
        <div id="report-grid"></div>
        <div class="total-line" id="total-line">مجموع: <span>۰ ساعت</span></div>
      </div>

      <!-- Activity Map -->
      <div class="card">
        <div class="card-title">نقشه ماهانه موضوع</div>
        <div class="map-controls">
          <select id="map-cat-select"></select>
          <div class="map-month-nav">
            <button id="map-prev" title="ماه قبل">&#8249;</button>
            <div id="map-month-label"></div>
            <button id="map-next" title="ماه بعد">&#8250;</button>
          </div>
        </div>
        <div id="activity-map" class="activity-map"></div>
        <div class="map-summary" id="map-summary"></div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="card" style="margin-bottom:0">
      <div class="card-title">
        تایم‌لاین &mdash; <span id="tl-date" style="color:var(--accent2)"></span>
      </div>
      <div id="empty-msg" class="empty-msg">
        <div class="empty-icon">📅</div>
        هنوز فعالیتی برای این روز ثبت نکرده‌اید
      </div>
      <div class="tl-wrap" id="timeline" style="display:none"></div>
    </div>
  </div>

</div>

<script>
const defaultCats = [];

function load(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch{return def;} }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }

async function saveCloud(){

  const data = {
    events,
    cats,
    liveSession,
    theme
  };

await window.fbSet(
  window.fbRef(window.db, "plannerData"),
    data
  );
}

async function loadCloud(){

  const snap =
  await window.fbGet(
    window.fbRef(window.db, "plannerData")
  );

  if(!snap.exists()) return;

  const data = snap.val();

  events = data.events || [];
  cats = data.cats || [];
  liveSession = data.liveSession || null;
  theme = data.theme || "dark";
}

let events = load('planner_ev', []);
let cats   = load('planner_cats', defaultCats);
let curDate= new Date().toISOString().split('T')[0];
let mapMonth = curDate.slice(0,7);
let liveSession = load('planner_live', null);
let theme = load('planner_theme', 'dark');

function applyTheme(){
  document.body.dataset.theme=theme;
  const sel=document.getElementById('theme-select');
  if(sel) sel.value=theme;
}

function getCat(id){ return cats.find(c=>c.id===id) || {name:'موضوع حذف‌شده', color:'#9ca3af'}; }

function getNow(){
  const n=new Date();
  return pad(n.getHours())+':'+pad(n.getMinutes());
}
function pad(n){ return String(n).padStart(2,'0'); }

function parseTime(s){
  s=(s||'').trim();
  // auto-colon: "1430" → "14:30"
  if(/^\d{4}$/.test(s)) s=s.slice(0,2)+':'+s.slice(2);
  const m=s.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  const h=+m[1], mn=+m[2];
  if(h>23||mn>59) return null;
  return h*60+mn;
}

function fmtTime(mins){
  return pad(Math.floor(mins/60))+':'+pad(mins%60);
}

function fmtDur(mins){
  const h=Math.floor(mins/60), m=mins%60;
  if(h===0) return m+'m';
  if(m===0) return h+'h';
  return h+'h '+m+'m';
}

function fmtDateLabel(d){
  const [y,mo,day]=d.split('-').map(Number);
  const dt=new Date(y, mo-1, day);
  const days=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه','شنبه'];
  const months=['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
  return days[dt.getDay()]+' '+day+' '+months[mo-1]+' '+y;
}

function shiftDay(n){
  const [y,mo,d]=curDate.split('-').map(Number);
  const dt=new Date(y,mo-1,d);
  dt.setDate(dt.getDate()+n);
  curDate=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
  render();
}

// --- Render Categories ---
function renderCats(){
  const sel=document.getElementById('cat-select');
  const mapSel=document.getElementById('map-cat-select');
  const manager=document.getElementById('cat-manager');
  const current=sel.value;
  const mapCurrent=mapSel.value;
  sel.innerHTML='';
  mapSel.innerHTML='';
  manager.innerHTML='';
  if(!cats.length){
    const o=document.createElement('option');
    o.value='';
    o.textContent='اول موضوع بسازید';
    o.disabled=true;
    o.selected=true;
    sel.appendChild(o);
    const mo=o.cloneNode(true);
    mapSel.appendChild(mo);
    manager.innerHTML='<div class="cat-empty">هنوز موضوعی ندارید.</div>';
    return;
  }
  cats.forEach(c=>{
    const o=document.createElement('option');
    o.value=c.id; o.textContent=c.name;
    sel.appendChild(o);
    mapSel.appendChild(o.cloneNode(true));

    const item=document.createElement('div');
    item.className='cat-item';
    item.style.setProperty('--cat-color', c.color);
    item.innerHTML=`
      <span class="cat-swatch"></span>
      <span class="cat-name">${escHtml(c.name)}</span>
      <input class="cat-color-edit" type="color" value="${c.color}" aria-label="تغییر رنگ ${escHtml(c.name)}">
      <button class="cat-delete" type="button" title="حذف موضوع">×</button>
    `;
    const colorInput=item.querySelector('.cat-color-edit');
    colorInput.oninput=()=>{
      c.color=colorInput.value;
      item.style.setProperty('--cat-color', c.color);
      saveCloud();
      render();
    };
    item.querySelector('.cat-delete').onclick=()=>delCat(c.id);
    manager.appendChild(item);
  });
  if(current && cats.some(c=>c.id===current)) sel.value=current;
  if(mapCurrent && cats.some(c=>c.id===mapCurrent)) mapSel.value=mapCurrent;
  else mapSel.value=cats[0].id;
}

// --- Render Timeline ---
function renderTimeline(){
  const tl=document.getElementById('timeline');
  const em=document.getElementById('empty-msg');
  document.getElementById('tl-date').textContent=fmtDateLabel(curDate);

  const day=events.filter(e=>e.date===curDate)
    .sort((a,b)=>a.sMins-b.sMins);

  if(!day.length){ em.style.display='block'; tl.style.display='none'; return; }
  em.style.display='none'; tl.style.display='block';
  tl.innerHTML='';

  day.forEach(ev=>{
    const cat=getCat(ev.catId);
    const el=document.createElement('div');
    el.className='tl-item';
    el.style.setProperty('--ic', cat.color);
    el.innerHTML=`
      <div class="tl-dot"></div>
      <div class="tl-info">
        <div class="tl-title">${escHtml(ev.title)}</div>
        <div class="tl-meta">
          <span class="tl-badge" style="background:${cat.color}">${escHtml(cat.name)}</span>
          <span class="tl-time">${fmtTime(ev.sMins)}</span>
          <span style="color:var(--muted);font-size:11px">→</span>
          <span class="tl-time">${fmtTime(ev.eMins)}</span>
          <span class="tl-dur">(${fmtDur(ev.durMins)})</span>
        </div>
      </div>
      <button class="btn-del" onclick="delEv('${ev.id}')">✕</button>
    `;
    tl.appendChild(el);
  });
}

// --- Render Report ---
function renderReport(){
  const [y,mo,d]=curDate.split('-').map(Number);
  const ref=new Date(y,mo-1,d);
  const from=new Date(ref); from.setDate(from.getDate()-6);

  const week=events.filter(e=>{
    const [ey,em,ed]=e.date.split('-').map(Number);
    const dt=new Date(ey,em-1,ed);
    return dt>=from && dt<=ref;
  });

  const sums={}; let total=0;
  week.forEach(e=>{ sums[e.catId]=(sums[e.catId]||0)+e.durMins; total+=e.durMins; });

  const grid=document.getElementById('report-grid');
  grid.innerHTML='';

  const reportCats=[...cats];
  Object.keys(sums).forEach(catId=>{
    if(!reportCats.some(c=>c.id===catId)){
      reportCats.push({id:catId, ...getCat(catId)});
    }
  });

  reportCats.forEach(cat=>{
    const mins=sums[cat.id]||0;
    if(!mins) return;
    const pct=total>0?Math.round((mins/total)*100):0;
    const h=Math.floor(mins/60), m=mins%60;
    const durStr=h?h+'h'+(m?' '+m+'m':''):m+'m';
    const el=document.createElement('div');
    el.className='report-item';
    el.innerHTML=`
      <div class="report-header">
        <span style="color:${cat.color}">${escHtml(cat.name)}</span>
        <span>${durStr} (${pct}٪)</span>
      </div>
      <div class="prog-bg">
        <div class="prog-fill" style="background:${cat.color};width:${pct}%"></div>
      </div>
    `;
    grid.appendChild(el);
  });

  const th=Math.floor(total/60), tm=total%60;
  const tStr=th?th+'h'+(tm?' '+tm+'m':''):tm+'m';
  document.getElementById('total-line').innerHTML=`مجموع ۷ روز: <span>${tStr}</span>`;
}

function shiftMapMonth(n){
  const [y,mo]=mapMonth.split('-').map(Number);
  const dt=new Date(y, mo-1+n, 1);
  mapMonth=dt.getFullYear()+'-'+pad(dt.getMonth()+1);
  renderActivityMap();
}

function renderActivityMap(){
  const map=document.getElementById('activity-map');
  const summary=document.getElementById('map-summary');
  const sel=document.getElementById('map-cat-select');
  const label=document.getElementById('map-month-label');
  const [y,mo]=mapMonth.split('-').map(Number);
  const monthNames=['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
  label.textContent=monthNames[mo-1]+' '+y;
  map.innerHTML='';

  ['ش','ی','د','س','چ','پ','ج'].forEach(day=>{
    const el=document.createElement('div');
    el.className='map-weekday';
    el.textContent=day;
    map.appendChild(el);
  });

  if(!cats.length || !sel.value){
    map.innerHTML='<div class="map-empty" style="grid-column:1/-1">برای دیدن نقشه، اول یک موضوع بسازید.</div>';
    summary.textContent='';
    return;
  }

  const cat=getCat(sel.value);
  const daysInMonth=new Date(y, mo, 0).getDate();
  const firstDay=new Date(y, mo-1, 1).getDay();
  const startOffset=(firstDay+1)%7; // Saturday-first grid
  const sums={};
  let total=0;

  events.forEach(e=>{
    if(e.catId!==sel.value || !e.date.startsWith(mapMonth)) return;
    const day=Number(e.date.slice(8,10));
    sums[day]=(sums[day]||0)+e.durMins;
    total+=e.durMins;
  });

  const max=Math.max(0, ...Object.values(sums));
  for(let i=0; i<startOffset; i++){
    const blank=document.createElement('div');
    blank.className='map-day is-empty';
    map.appendChild(blank);
  }

  for(let day=1; day<=daysInMonth; day++){
    const mins=sums[day]||0;
    const ratio=max ? mins/max : 0;
    const fill=Math.round(ratio*100);
    const size=mins ? Math.round(9 + ratio*23) : 5;
    const strength=mins ? Math.round(35 + ratio*65) : 18;
    const glow=Math.round(ratio*55);
    const dateStr=mapMonth+'-'+pad(day);
    const el=document.createElement('div');
    el.className='map-day';
    el.style.setProperty('--dot-color', cat.color);
    el.style.setProperty('--dot-size', size+'px');
    el.style.setProperty('--dot-strength', strength+'%');
    el.style.setProperty('--dot-glow', glow+'%');
    el.title=mins ? `${dateStr} - ${cat.name}: ${fmtDur(mins)} (${fill}٪ از بیشترین روز ماه)` : `${dateStr} - ${cat.name}: بدون ثبت`;
    el.innerHTML=`
      <span class="map-day-num">${day}</span>
      <span class="map-dot"></span>
    `;
    map.appendChild(el);
  }

  summary.innerHTML=total
    ? `مجموع این ماه برای <span>${escHtml(cat.name)}</span>: <span>${fmtDur(total)}</span>`
    : `برای <span>${escHtml(cat.name)}</span> در این ماه چیزی ثبت نشده.`;
}

function render(){
  document.getElementById('date-label').textContent=fmtDateLabel(curDate);
  renderTimeline();
  renderReport();
  renderActivityMap();
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// --- Events ---
window.delEv=function(id){
  if(!confirm('این فعالیت حذف شود؟')) return;
  events=events.filter(e=>e.id!==id);
  saveCloud();
  render();
};

window.delCat=function(id){
  const cat=getCat(id);
  if(!confirm(`موضوع «${cat.name}» حذف شود؟ فعالیت‌های قبلی پاک نمی‌شوند.`)) return;
  cats=cats.filter(c=>c.id!==id);
  saveCloud();
  if(liveSession && liveSession.catId===id){
    liveSession=null;
    saveCloud();
  }
  renderCats();
  render();
  updateLiveButton();
};

function setupTimeInput(inp){
  inp.addEventListener('input', function(){
    let v=this.value.replace(/[^\d:]/g,'');
    const digits=v.replace(/:/g,'');
    if(digits.length>=3 && !v.includes(':'))
      v=digits.slice(0,2)+':'+digits.slice(2,4);
    this.value=v;
  });
  inp.addEventListener('blur', function(){
    const v=this.value.trim();
    if(v && parseTime(v)===null){
      this.style.borderColor='#ef4444';
      this.style.boxShadow='0 0 0 3px rgba(239,68,68,.2)';
    } else {
      this.style.borderColor='';
      this.style.boxShadow='';
    }
  });
  inp.addEventListener('focus', function(){
    this.style.borderColor='';
    this.style.boxShadow='';
  });
}

document.getElementById('prev-day').onclick = ()=>shiftDay(-1);
document.getElementById('next-day').onclick = ()=>shiftDay(1);
document.getElementById('btn-today').onclick = ()=>{
  curDate=new Date().toISOString().split('T')[0];
  render();
};
document.getElementById('map-prev').onclick = ()=>shiftMapMonth(-1);
document.getElementById('map-next').onclick = ()=>shiftMapMonth(1);
document.getElementById('map-cat-select').onchange = renderActivityMap;
document.getElementById('theme-select').onchange = e=>{
  theme=e.target.value;
  saveCloud();
  applyTheme();
};

document.getElementById('btn-now-s').onclick = ()=>{ document.getElementById('start-time').value=getNow(); };
document.getElementById('btn-now-e').onclick = ()=>{ document.getElementById('end-time').value=getNow(); };

document.getElementById('toggle-cat').onclick = ()=>{
  const b=document.getElementById('new-cat-box');
  b.style.display = b.style.display==='block'?'none':'block';
};

document.getElementById('save-cat').onclick = ()=>{
  const name=document.getElementById('new-cat-name').value.trim();
  const color=document.getElementById('new-cat-color').value;
  if(!name){ alert('نام دسته‌بندی را وارد کنید'); return; }
  const nc={id:'c'+Date.now(), name, color};
  cats.push(nc);
  saveCloud();
  renderCats();
  document.getElementById('cat-select').value=nc.id;
  document.getElementById('map-cat-select').value=nc.id;
  document.getElementById('new-cat-name').value='';
  document.getElementById('new-cat-box').style.display='none';
  render();
};

function createEvent({title, catId, stRaw, enRaw, date=curDate}){
  const err=document.getElementById('time-err');
  if(!title){ document.getElementById('act-title').focus(); return false; }
  if(!catId || !cats.some(c=>c.id===catId)){
    alert('اول یک موضوع بسازید یا انتخاب کنید');
    return false;
  }

  const sMins=parseTime(stRaw);
  const eMinsRaw=parseTime(enRaw);
  if(sMins===null||eMinsRaw===null){
    err.style.display='block';
    setTimeout(()=>err.style.display='none', 3000);
    return false;
  }

  let durMins=eMinsRaw-sMins;
  if(durMins<0) durMins+=24*60;  // شیفت شبانه
  if(durMins===0){ alert('زمان شروع و پایان نمی‌تواند یکسان باشد'); return false; }

  const eMins=sMins+durMins > 1440 ? sMins+durMins-1440 : sMins+durMins;

  const ev={
    id: Date.now().toString(),
    date, title, catId,
    sMins, eMins, durMins
  };
  events.push(ev);
  saveCloud();
  return true;
}

function clearEventForm(){
  document.getElementById('act-title').value='';
  document.getElementById('start-time').value='';
  document.getElementById('end-time').value='';
}

document.getElementById('add-btn').onclick = ()=>{
  const ok=createEvent({
    title: document.getElementById('act-title').value.trim(),
    catId: document.getElementById('cat-select').value,
    stRaw: document.getElementById('start-time').value,
    enRaw: document.getElementById('end-time').value
  });
  if(!ok) return;

  clearEventForm();
  render();
};

function updateLiveButton(){
  const btn=document.getElementById('live-btn');
  const status=document.getElementById('live-status');
  if(!btn || !status) return;
  if(liveSession){
    btn.classList.add('is-running');
    btn.textContent='پایان و ثبت فعالیت';
    const cat=getCat(liveSession.catId);
    status.textContent=`در حال ثبت: ${liveSession.title}، از ${fmtTime(liveSession.sMins)}، ${cat.name}`;
    return;
  }
  btn.classList.remove('is-running');
  btn.textContent='شروع / پایان با ساعت سیستم';
  status.textContent='';
}

document.getElementById('live-btn').onclick=()=>{
  if(!liveSession){
    const title=document.getElementById('act-title').value.trim();
    const catId=document.getElementById('cat-select').value;
    if(!title){ document.getElementById('act-title').focus(); return; }
    if(!catId || !cats.some(c=>c.id===catId)){
      alert('اول یک موضوع بسازید یا انتخاب کنید');
      return;
    }
    const now=getNow();
    const sMins=parseTime(now);
    liveSession={title, catId, date:curDate, sMins};
    saveCloud();
    document.getElementById('start-time').value=now;
    document.getElementById('end-time').value='';
    updateLiveButton();
    return;
  }

  const endNow=getNow();
  const ok=createEvent({
    title: liveSession.title,
    catId: liveSession.catId,
    stRaw: fmtTime(liveSession.sMins),
    enRaw: endNow,
    date: liveSession.date
  });
  if(!ok) return;
  liveSession=null;
  saveCloud();
  clearEventForm();
  render();
  updateLiveButton();
};

// Keyboard shortcut: Enter to add
document.getElementById('end-time').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('add-btn').click();
});

setupTimeInput(document.getElementById('start-time'));
setupTimeInput(document.getElementById('end-time'));

console.log("fbGet =", window.fbGet);
console.log("fbSet =", window.fbSet);

(async ()=>{

  await loadCloud();

  applyTheme();
  renderCats();
  render();
  updateLiveButton();

})();
